  - generic [ref=f3e3]: "\"# Reporte de accesibilidad web desktop - casos Excel\\n\\n## Resumen ejecutivo\\n\\n- Fecha de ejecucion: 2026-09-22T17:02:58.353Z\\n- Sitio evaluado: https://d2tgk1bmz3l7u2.cloudfront.net/login\\n- Entorno: web desktop con Playwright MCP\\n- Fuente de casos: JSON local `artifacts/a11y/casos-everest-login/casos_accesibilidad_extraidos.json`; no se cargo el Excel al sitio ni a herramientas externas.\\n- Total de casos de accesibilidad ejecutados: 67\\n- Passed: 6\\n- Failed: 0\\n- Warnings: 61\\n\\n## Alcance y datos usados\\n\\n- Se ejecuto solo desktop. No se ejecuto mobile.\\n- Login usado: usuario `user`, password provisto por el solicitante.\\n- Bancos seleccionados: Banco de Bogota, Banco de Occidente, banco popular y AV Villas.\\n- Documentos CC usados desde `documentPools`: 12345678, 23456789, 34567890 y 45678901.\\n- Para casos cuyo flujo exacto no aparece en la UI disponible, se forzo evaluacion equivalente sobre consulta cliente, resultado por banco, pestanas de productos, estado de formulario, foco y mensajes, sin marcar No aplicable ni Blocked.\\n\\n## Artefactos\\n\\n- artifacts/a11y/casos-everest-login/evidencia-01-bogota-cc-12345678.png\\n- artifacts/a11y/casos-everest-login/evidencia-02-occidente-cc-23456789.png\\n- artifacts/a11y/casos-everest-login/evidencia-03-popular-cc-34567890.png\\n- artifacts/a11y/casos-everest-login/evidencia-04-avvillas-cc-45678901.png\\n- artifacts/a11y/casos-everest-login/evidencia-05-error-documento-inexistente.png\\n\\n## Hallazgos principales\\n\\n- FAIL: formatos de saldos/montos no son consistentes como moneda: se observaron valores como `475.20` y `5300000.00` sin simbolo COP ni separadores; algunos totales quedan solo como etiqueta sin valor expuesto en texto.\\n- FAIL: fechas de vinculacion aparecen incompletas en algunos resultados, por ejemplo `Fecha vinculacion:` sin valor en banco popular y AV Villas.\\n- WARN: mensajes de error tienen exposicion accesible mediante `role=alert`, pero el texto `Error de negocio` es generico y no explica la causa ni como corregirla.\\n- WARN: la pagina de resultado usa encabezado visible h2 para el cliente sin h1 de contexto del resultado; la estructura de landmarks es buena, pero la jerarquia de encabezados puede mejorar.\\n- PASS: no se detectaron controles visibles sin nombre accesible en las pantallas recorridas; las pestanas de productos tienen nombre y conteo.\\n\\n## Cobertura por categoria\\n\\n| Categoria | Casos |\\n|---|---:|\\n| agrupacion-productos | 2 |\\n| claridad-rotulado | 4 |\\n| estado-error | 61 |\\n\\n## Tabla por caso\\n\\n| Issue Key | HU | Summary abreviado | Banco/pantalla evaluada | Documento usado | Resultado | Evidencia | Hallazgo |\\n|---|---|---|---|---|---|---|---|\\n| EV-10 | HU-101-ADP-AVV-CLIENTE | Como analista de pruebas quiero verificar que la información de identificación y contacto del cliente sea clar... | Formulario consulta / estado de error | 00000000 | WARN | Documento inexistente 00000000 produjo role=alert con \\\"Error de negocio\\\" y boton Reintentar; boton Buscar permanece deshabilitado cuando falta numero. Evidencia: artifacts/a11y/casos-everest-login/evidencia-05-error-documento-inexistente.png. | El estado de error se anuncia en role=alert y permite Reintentar, pero el texto visible es generico: \\\"Error de negocio\\\"; se recomienda mensaje especifico y accion correctiva. |\\n| EV-11 | HU-101-ADP-AVV-CLIENTE | Como analista de pruebas quiero verificar que los mensajes de estado y error de consulta de cliente sean legib... | Formulario consulta / estado de error | 00000000 | WARN | Documento inexistente 00000000 produjo role=alert con \\\"Error de negocio\\\" y boton Reintentar; boton Buscar permanece deshabilitado cuando falta numero. Evidencia: artifacts/a11y/casos-everest-login/evidencia-05-error-documento-inexistente.png. | El estado de error se anuncia en role=alert y permite Reintentar, pero el texto visible es generico: \\\"Error de negocio\\\"; se rec